name: Release checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
permissions:
  contents: read
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Configure disposable test storage
        run: |
          echo "SCHOLARSCOUT_DATA_DIR=$RUNNER_TEMP/scholarscout-tests" >> "$GITHUB_ENV"
      - run: python scripts/check_secrets.py
      - run: "python -m pip install --only-binary=:all: --require-hashes -r backend/requirements.txt"
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pip check
      - run: pip-audit --no-deps --disable-pip --strict -r backend/requirements.lock.txt
      - run: ruff check backend/app scripts/start_server.py scripts/healthcheck.py scripts/validate_deployment.py scripts/lock_requirements.py --select F821,F811,E722
      - run: python scripts/validate_deployment.py
      - run: python -m pytest tests/ -q
        working-directory: backend
      - run: python scripts/release_gate.py
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npm run verify:render
  image:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: docker build --pull -f Dockerfile.backend -t scholarscout:ci .
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Export validated free-tier configuration
        run: |
          python -m pip install PyYAML==6.0.3
          python scripts/validate_deployment.py --env-file "$RUNNER_TEMP/scholarscout-free.env"
      - name: Image advisories
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: scholarscout:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          scanners: vuln
          version: v0.74.0
      - name: Free-tier upload, private retrieval and erasure in the release image
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm --read-only --cap-drop ALL
          --security-opt no-new-privileges:true --pids-limit 160
          --memory 512m --memory-swap 512m --cpus 0.1
          --env-file "$RUNNER_TEMP/scholarscout-free.env"
          --tmpfs /tmp:rw,noexec,nosuid,size=128m,mode=1777
          scholarscout:ci python /app/scripts/release_gate.py
      - name: Real server startup and health
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          secret=$(openssl rand -hex 32)
          echo "::add-mask::$secret"
          docker run -d --name scholarscout-smoke --read-only --cap-drop ALL --security-opt no-new-privileges:true --pids-limit 160 --memory 512m --memory-swap 512m --cpus 0.1 --env-file "$RUNNER_TEMP/scholarscout-free.env" --tmpfs /tmp:rw,noexec,nosuid,size=128m,mode=1777 -e ALLOWED_HOSTS=localhost -e SCHOLARSCOUT_SECRET_KEY="$secret" -e PORT=8014 -p 127.0.0.1:8014:8014 scholarscout:ci
          for attempt in $(seq 1 90); do
            if curl --fail --silent -H 'Host: localhost' http://127.0.0.1:8014/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs scholarscout-smoke
          docker inspect --format '{{json .State}}' scholarscout-smoke
          exit 1
      - name: Stop synthetic container
        if: always()
        run: docker rm -f scholarscout-smoke 2>/dev/null || true
